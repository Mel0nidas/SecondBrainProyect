name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

  deploy:
    # Solo en push a main (no en pull requests), y solo si test paso.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Necesario para que GitHub emita el token OIDC que AWS valida --
      # sin esto, "aws-actions/configure-aws-credentials" no funciona.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales de AWS (OIDC, sin secretos guardados)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login a ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: segundo-cerebro
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Actualizar la instancia via SSM
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # La instancia tiene rol IAM con permiso de lectura sobre ECR,
          # pero el token de docker que deja el UserData vence a las 12 h.
          # Sin reautenticar, "docker-compose pull" falla con
          # "authorization token has expired" y el deploy no llega nunca
          # a produccion (fue exactamente lo que paso con la Fase 7).
          REMOTE="cd /opt/segundo-cerebro"
          REMOTE="$REMOTE && aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY"
          REMOTE="$REMOTE && docker-compose pull && docker-compose up -d"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[\"$REMOTE\"]" \
            --query "Command.CommandId" --output text)

          # Espera a que termine, sin abortar aca aunque el comando falle:
          # queremos imprimir su salida real antes de marcar el workflow.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          ESTADO=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "Estado del comando SSM: $ESTADO"
          [ "$ESTADO" = "Success" ]
