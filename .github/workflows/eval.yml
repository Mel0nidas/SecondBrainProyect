name: Eval

# Los sets de evaluacion pegan a APIs reales (Claude para el Router,
# Voyage para el Bibliotecario) y cuestan unos centavos por corrida, asi
# que NO van en el CI de cada push. Corren:
#   - a mano, desde la pestana Actions (workflow_dispatch)
#   - en PRs que tocan el codigo del que depende cada metrica
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/grafo/prompts/**"
      - "src/grafo/nodos/router.py"
      - "src/grafo/nodos/bibliotecario.py"
      - "src/grafo/estado.py"
      - "src/rag/indexar.py"
      - "tests/eval/**"

jobs:
  eval-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Correr el set de evaluacion del Router
        env:
          # Agregar en Settings -> Secrets and variables -> Actions -> Secrets.
          # Es una API key de Anthropic, no una credencial de AWS.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # El eval no necesita trazas; que no intente mandarlas.
          LANGSMITH_TRACING: "false"
        run: uv run python -m tests.eval.evaluar

  # Metrica secundaria (DISEÑO.md §6): recall@3 de la busqueda semantica.
  # No llama al LLM, pero embebe el corpus y las consultas con Voyage
  # (2 requests por corrida, por debajo del limite de la cuenta sin tarjeta).
  eval-bibliotecario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Correr el set de evaluacion del Bibliotecario
        env:
          # Agregar en Settings -> Secrets and variables -> Actions -> Secrets.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          LANGSMITH_TRACING: "false"
        run: uv run python -m tests.eval.evaluar_bibliotecario
