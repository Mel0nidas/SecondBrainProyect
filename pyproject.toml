[project]
name = "segundo-cerebro"
version = "0.1.0"
description = "Agentes LangGraph sobre boveda Obsidian, con Telegram como interfaz de entrada"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.1",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/grafo", "src/mcp_obsidian", "src/rag", "src/telegram"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
